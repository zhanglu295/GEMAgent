[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemagent"
version = "0.2.0"
description = "Evidence-guided multi-agent review for genome-scale metabolic model curation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Yi Ding"},
  {name = "Zeming Li"},
  {name = "Lu Zhang", email = "ericluzhang@hkbu.edu.hk"},
]
keywords = [
  "bioinformatics",
  "constraint-based modeling",
  "gapseq",
  "genome-scale metabolic models",
  "large language models",
  "metabolic network reconstruction",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "cobra>=0.26",
  "openai>=1.0",
  "python-dotenv>=1.0",
  "requests>=2.28",
]

[project.scripts]
gemagent = "gemagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemagent = ["adapters/*.R", "recipes/*.json", "impl/**/*.sh", "impl/**/*.R", "impl/**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
